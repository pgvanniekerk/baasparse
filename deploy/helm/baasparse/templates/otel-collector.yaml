{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "baasparse.fullname" . }}-otel-collector
  labels:
    {{- include "baasparse.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http: { endpoint: 0.0.0.0:4318 }
          grpc: { endpoint: 0.0.0.0:4317 }
    processors:
      batch: {}
    exporters:
      debug: { verbosity: normal }
      {{- if .Values.otelCollector.prometheusRemoteWrite }}
      prometheusremotewrite: { endpoint: {{ .Values.otelCollector.prometheusRemoteWrite | quote }} }
      {{- end }}
      {{- if .Values.otelCollector.lokiEndpoint }}
      otlphttp/loki: { endpoint: {{ .Values.otelCollector.lokiEndpoint | quote }} }
      {{- end }}
      {{- if .Values.otelCollector.tempoEndpoint }}
      otlp/tempo: { endpoint: {{ .Values.otelCollector.tempoEndpoint | quote }}, tls: { insecure: true } }
      {{- end }}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug{{ if .Values.otelCollector.tempoEndpoint }}, otlp/tempo{{ end }}]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug{{ if .Values.otelCollector.prometheusRemoteWrite }}, prometheusremotewrite{{ end }}]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug{{ if .Values.otelCollector.lokiEndpoint }}, otlphttp/loki{{ end }}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "baasparse.fullname" . }}-otel-collector
  labels:
    {{- include "baasparse.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "baasparse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        {{- include "baasparse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
      annotations:
        # Re-roll the collector when its config (derived from these values) changes.
        # (Hash the values, not this file — including the file here would recurse.)
        checksum/config: {{ .Values.otelCollector | toYaml | sha256sum }}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.113.0
          args: ["--config=/etc/otel/collector.yaml"]
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
          volumeMounts: [{ name: config, mountPath: /etc/otel }]
      volumes:
        - name: config
          configMap: { name: {{ include "baasparse.fullname" . }}-otel-collector }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "baasparse.fullname" . }}-otel-collector
  labels:
    {{- include "baasparse.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  selector:
    {{- include "baasparse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
{{- end }}
